name: pre-commit Update

on:
    schedule:
        - cron: "0 7 1/7 * *" # At 7:00 every 7 days
    workflow_dispatch:

jobs:
    pre-commit-update:
        permissions:
            pull-requests: write
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
            - name: Run pre-commit's autoupdate
              run: |
                  # ignore exit code
                  prek auto-update --freeze --cooldown-days 7 || true
            - name: Create Pull Request
              id: cpr
              uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
              with:
                  commit-message: "chore: :robot: pre-commit update"
                  title: "[AUTO] pre-commit update"
                  branch: auto-pre-commit-update
                  delete-branch: true
                  labels: chore
            - name: Check outputs
              run: |
                  echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
                  echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
